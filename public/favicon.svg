<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: rounded square, matches app's dark blueprint bg -->
  <rect width="64" height="64" rx="14" fill="#1C2530"/>

  <!-- Subtle blueprint grid dot, single accent -->
  <rect x="6" y="6" width="52" height="52" rx="9" fill="none" stroke="#3D5468" stroke-width="1.5" opacity="0.5"/>

  <!-- Plumb line: vertical line with a bob, referencing the "Plumb Line" mark -->
  <line x1="26" y1="14" x2="26" y2="50" stroke="#7C93A6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="26" cy="50" r="4.5" fill="#7C93A6"/>

  <!-- Tolerance gauge tick + fill, the app's signature variance-gauge motif -->
  <rect x="34" y="30" width="20" height="5" rx="2.5" fill="#101820"/>
  <rect x="34" y="30" width="13" height="5" rx="2.5" fill="#E8622C"/>
  <line x1="45.7" y1="26" x2="45.7" y2="39" stroke="#F2EDE4" stroke-width="1.6"/>
</svg>
